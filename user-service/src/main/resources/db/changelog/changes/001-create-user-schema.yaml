databaseChangeLog:
  - changeSet:
      id: 001-create-user-schema
      author: ecommerce
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE SCHEMA IF NOT EXISTS user_service
        - createTable:
            schemaName: user_service
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: user_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(254)
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: VARCHAR(12)
              - column:
                  name: image_url
                  type: TEXT
              - column:
                  name: keycloak_user_id
                  type: VARCHAR(255)
        - addUniqueConstraint:
            schemaName: user_service
            tableName: users
            columnNames: user_name
            constraintName: uq_users_username
        - addUniqueConstraint:
            schemaName: user_service
            tableName: users
            columnNames: email
            constraintName: uq_users_email
        - addUniqueConstraint:
            schemaName: user_service
            tableName: users
            columnNames: phone_number
            constraintName: uq_users_phone
        - addUniqueConstraint:
            schemaName: user_service
            tableName: users
            columnNames: keycloak_user_id
            constraintName: uq_users_keycloak_user_id
        - createTable:
            schemaName: user_service
            tableName: roles
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roles
                    nullable: false
              - column:
                  name: role_name
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: user_service
            tableName: roles
            columnNames: role_name
            constraintName: uq_roles_name
        - createTable:
            schemaName: user_service
            tableName: user_role
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            schemaName: user_service
            tableName: user_role
            columnNames: user_id, role_id
            constraintName: pk_user_role
        - addForeignKeyConstraint:
            baseTableSchemaName: user_service
            baseTableName: user_role
            baseColumnNames: user_id
            referencedTableSchemaName: user_service
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_user_role_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: user_service
            baseTableName: user_role
            baseColumnNames: role_id
            referencedTableSchemaName: user_service
            referencedTableName: roles
            referencedColumnNames: role_id
            constraintName: fk_user_role_role
            onDelete: RESTRICT
        - createIndex:
            schemaName: user_service
            tableName: user_role
            indexName: idx_user_role_role_id
            columns:
              - column:
                  name: role_id
